<script>
// Supabase：共通のクライアント
window.getSb = function () {
  if (window.__sb) return window.__sb;
  if (!(typeof ONLINE !== 'undefined' && ONLINE.url.startsWith('https://') && ONLINE.key && window.supabase)) return null;
  window.__sb = window.supabase.createClient(ONLINE.url, ONLINE.key, { realtime: { params: { eventsPerSecond: 20 } } });
  return window.__sb;
};
// ランキング（scores テーブル）
window.makeSupabaseRank = function () {
  const sb = window.getSb(); if (!sb) return null;
  let dev = '';
  try { dev = localStorage.getItem('flickRunDevice') || ''; if (!dev) { dev = 'd' + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('flickRunDevice', dev); } } catch (e) { dev = 'd' + Math.random().toString(36).slice(2); }
  let mine = null;
  return {
    canSubmit: true,
    async top(n) {
      const { data, error } = await sb.from('scores').select('name,score,skin').order('score', { ascending: false }).limit(n);
      if (error) throw error;
      return (data || []).map(r => ({ ...r, me: !!mine && r.name === mine.name && r.score === mine.score }));
    },
    async submit(name, score, skin) {
      mine = { name, score };
      const { error } = await sb.from('scores').upsert({ device_id: dev, name, score, skin, updated_at: new Date().toISOString() }, { onConflict: 'device_id' });
      if (error) throw error;
    },
  };
};
</script>

<script>
// ============================================================

// ============================================================
const ONLINE = {
  url: 'https://zgrmlgwpsalmanhkqkvx.supabase.co',   // 例: https://xxxxxxxx.supabase.co

// ============================================================
const cv = document.getElementById('c');

let H = 470, GROUND = 380;

const PX = 105;            // プレイヤーのx
const PW = 30;             // プレイヤーの幅
const overlay = document.getElementById('overlay');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');

let best = 0, playerName = '';

const NEED = { pit: 'jump', door: 'open', rock: 'punch', river: 'swim', banana: 'dodge', carrot: 'eat' };
const ICON = { pit: 'はねる', door: 'ひらく', rock: 'ぱんち', river: 'およぐ', banana: 'よける', carrot: 'たべる' };


// ===== サウンド（Web Audioで合成） =====
let AC = null, master = null, bgmGain = null, sfxGain = null, muted = false;

    master = AC.createGain(); master.gain.value = muted ? 0 : 1; master.connect(AC.destination);
    bgmGain = AC.createGain(); bgmGain.gain.value = 0.16; bgmGain.connect(master);

function tone(freq, dur, type = 'square', vol = 0.3, slideTo = null, when = 0, dest = null) {

  const o = AC.createOscillator(), g = AC.createGain();

function noise(dur, vol = 0.3, freq = 2000, q = 1, when = 0, type = 'bandpass') {
  if (!AC) return;

    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

const SFX = {
  key()   { noise(0.03, 0.35, 3200, 2); tone(1400, 0.02, 'sine', 0.06); },       // iPhone風「カチッ」
  fnKey() { noise(0.04, 0.35, 1500, 2); tone(700, 0.03, 'sine', 0.06); },

  good()  { tone(1046, 0.08, 'square', 0.12, null, 0.06); tone(1568, 0.12, 'square', 0.12, null, 0.12); },

  eat()   { [880, 1175, 1568, 2093].forEach((f, i) => tone(f, 0.1, 'square', 0.13, null, i * 0.06)); },

const midi = n => 440 * Math.pow(2, (n - 69) / 12);

  if (!AC) return;
  bgmOn = true; step = 0; nextT = AC.currentTime + 0.1;
  if (!bgmTimer) bgmTimer = setInterval(bgmTick, 25);
}

  if (!bgmOn || !AC) return;
  const spd = typeof speed === 'number' ? speed / K : 190;
  const stepDur = 60 / (140 + (spd - 190) * 0.12) / 2;   // 8分音符
  while (nextT < AC.currentTime + 0.12) {
    const when = nextT - AC.currentTime;
    const m = MEL[step % MEL.length];
    if (m) tone(midi(m), stepDur * 0.9, 'square', 0.22, null, when, bgmGain);
    if (step % 2 === 0) tone(midi(BASS[(step / 2) % BASS.length]), stepDur * 1.6, 'triangle', 0.5, null, when, bgmGain);
    if (step % 4 === 2) {   // ハイハット

    }
    nextT += stepDur; step++;
  }
}

let state = 'title'; // title | play | dying | over
let speed, dist, time, obs, nextSpawn, particles, popups, player, shake, cleared, deathT, deathType, bgOff;

let rng = Math.random;
function mulberry(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function zoneWidth() {

}

  const secs0 = Math.max(1.5, 2.6 - time * 0.008);

  'fuck','shit','bitch','porn','pussy','cunt','nigg','fag','rape','penis','dick','sex','xxx','unko','chinko','manko','shineyo'];
const NG_EXACT = ['ばか','あほ','くず','かす','ぶす','でぶ','えろ','えっち','ほも','れず','ass','baka','aho','ero','kuso','くそ','kill','shine','sine'];
function normName(t) {
  return String(t).normalize('NFKC').toLowerCase()
    .replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60))     // カタカナ→ひらがな
    .replace(/[ぁぃぅぇぉっゃゅょゎ]/g, ch => ({ 'ぁ':'あ','ぃ':'い','ぅ':'う','ぇ':'え','ぉ':'お','っ':'','ゃ':'や','ゅ':'ゆ','ょ':'よ','ゎ':'わ' }[ch]))
    .replace(/[\s　ー〜~\-_.・、。,!！?？*＊/\\|()（）「」『』【】\[\]{}<>＜＞'"`^+=#$%&@:;0-9]/g, '');
}
function isBadName(t) {
  const raw = String(t).normalize('NFKC').toLowerCase();
  const n = normName(t);
  const forms = [n, raw.replace(/\s/g, '')];
  // 小さい字も含めた形（せっくす など）
  forms.push(String(t).normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60)).replace(/[\s　ー〜~\-_.・、。,!！?？*＊]/g, ''));
  return forms.some(f => NG_PART.some(w => f.includes(normName(w)) || f.includes(w)) || NG_EXACT.some(w => f === normName(w) || f === w));
}

// 更新
function update(dt) {
  vsTick();
  if (state === 'play') {
    time += dt;
    speed = K * Math.min(430, 190 + time * 2.0);
    player.swim = !player.jumping && obs.some(o => o.type === 'river' && o.resolved && PX + 6 > o.x && PX - 6 < o.x + o.w);
    const dx = speed * dt * (player.swim ? 0.7 : 1);
    player.inv = Math.max(0, player.inv - dt);
    dist += dx; bgOff += dx;
    nextSpawn -= dx;
    if (nextSpawn <= 0) spawn();
    for (const o of obs) o.x -= dx;
    obs = obs.filter(o => o.x + o.w > -80);

    player.runT += dt * speed / MPX;
    if (player.jumping) {
      player.jt += dt;
      const t = player.jt / player.jdur;
      if (t >= 1) { player.jumping = false; player.y = 0; }
      else player.y = (player.y0 || 0) * (1 - t) + Math.sin(Math.PI * t) * Math.min(140, 70 + player.jdur * 90);
    }

    // むてき中は前のしかけを自動でクリア
    if (player.inv > 0) for (const o of obs) {
      if (!o.resolved && o.type !== 'carrot' && o.x - (PX + PW / 2) < 50) { o.locked = false; resolveObs(o); }
    }
    // 当たり判定
    for (const o of obs) {
      if (o.type === 'carrot') continue;
      if (o.type === 'river') {
        const over = PX + 6 > o.x && PX - 6 < o.x + o.w;
        if (over && !o.resolved && player.y < 4) { die('river'); break; }
      } else if (o.type === 'pit') {
        const over = PX + 6 > o.x && PX - 6 < o.x + o.w;
        if (over && player.y < 4) { die('pit'); break; }
      } else if (!o.resolved) {
        if (o.x <= PX + PW / 2 && o.x + o.w > PX - PW / 2) { die(o.type); break; }
      }
    }
    scoreEl.textContent = Math.floor(dist / MPX) + ' m';
  } else if (state === 'spectate') {
    spectateUpdate(dt);
  } else if (state === 'dying') {
    deathT += dt;
    if (deathType === 'pit') { player.vy += 1400 * dt; player.y -= player.vy * dt; }
    else if (deathType === 'river') { player.y = -Math.min(60, deathT * 70); }
    else { player.vy += 900 * dt; player.fallY += player.vy * dt; }
    if (deathT > 1.0) gameOver();
  }

  for (const o of obs) if (o.resolved) o.anim = Math.min(1, o.anim + dt * 6);
  player.punchT = Math.max(0, player.punchT - dt);
  player.openT = Math.max(0, player.openT - dt);
  for (const p of particles) { p.vy += 900 * dt; p.x += p.vx * dt - (state === 'play' ? speed * dt : 0); p.y += p.vy * dt; p.life -= dt * 1.2; }
  particles = particles.filter(p => p.life > 0);
  for (const p of popups) p.t += dt;
  popups = popups.filter(p => p.t < 0.8);
  shake = Math.max(0, shake - dt * 30);
}

// 描画
function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);

  // 空
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, '#7fd3ff'); g.addColorStop(1, '#d9f3ff');
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);

  // 雲
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  for (let i = 0; i < 4; i++) {
    const x = ((i * 260 - bgOff * 0.1) % (W + 200) + W + 200) % (W + 200) - 100;
    const y = Math.max(70, GROUND - 300) + (i % 2) * 40;
    ctx.beginPath(); ctx.arc(x, y, 22, 0, 7); ctx.arc(x + 25, y - 10, 28, 0, 7); ctx.arc(x + 55, y, 22, 0, 7); ctx.fill();
  }
  // 山
  ctx.fillStyle = '#9fd99a';
  for (let i = -1; i < 6; i++) {
    const x = i * 220 - (bgOff * 0.3 % 220);
    ctx.beginPath(); ctx.moveTo(x, GROUND); ctx.quadraticCurveTo(x + 110, GROUND - 120 - (i & 1) * 30, x + 220, GROUND); ctx.fill();
  }

  // 地面
  ctx.fillStyle = '#6cc05a'; ctx.fillRect(-20, GROUND, W + 40, 14);
  ctx.fillStyle = '#b07a45'; ctx.fillRect(-20, GROUND + 14, W + 40, H - GROUND);
  ctx.fillStyle = '#9a6837';
  for (let x = -(bgOff % 60); x < W + 60; x += 60) ctx.fillRect(x, GROUND + 34, 24, 6);

  // 反応ゾーン
  const tg = state === 'play' ? target() : null;
  if (tg) {
    const zw = zoneWidth();
    const zx = PX + PW / 2;
    const active = inZone(tg) && !tg.locked;
    ctx.fillStyle = active ? 'rgba(255,230,80,.35)' : 'rgba(255,255,255,.12)';
    ctx.fillRect(zx, GROUND - 4, zw, 8);
  }

  // しかけ
  for (const o of obs) drawObs(o, o === tg);

  // パーティクル
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.r, p.r);
  }
  ctx.globalAlpha = 1;

  if (player.inv > 0 && state === 'play') {
    ctx.save(); ctx.globalAlpha = (player.inv < 1 && Math.floor(player.inv * 10) % 2) ? 0.15 : 0.45;
    ctx.fillStyle = '#ffe066'; ctx.beginPath(); ctx.arc(PX, GROUND - 38 - player.y, 52, 0, 7); ctx.fill(); ctx.restore();
  }
  if (state !== 'spectate') drawPlayer();
  drawGhosts();
  for (const o of obs) if (o.type === 'river') {
    ctx.fillStyle = 'rgba(59,143,214,.75)'; ctx.fillRect(o.x, GROUND + 6, o.w, 30);
  }

  // ポップアップ
  for (const p of popups) {
    ctx.globalAlpha = 1 - p.t / 0.8;
    ctx.font = '800 26px sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.5)';
    ctx.strokeText(p.text, p.x, p.y - p.t * 40);
    ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y - p.t * 40);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  drawHUD();
}

function drawHUD() {
  if (document.body.classList.contains('menu')) return;
  ctx.save();
  ctx.font = '800 26px "M PLUS Rounded 1c", sans-serif'; ctx.textBaseline = 'top';
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(30,60,90,.55)'; ctx.fillStyle = '#fff';
  if (state === 'spectate') {
    const run = vsRivals().filter(r => r.st === 'play');
    const lead = run.length ? run.reduce((a, b) => b.dist > a.dist ? b : a) : null;
    ctx.fillStyle = 'rgba(20,25,40,.7)'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(W / 2 - 150, 10, 300, 58, 16) : ctx.rect(W / 2 - 150, 10, 300, 58); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = '800 20px "M PLUS Rounded 1c", sans-serif';
    ctx.fillText('👀 観戦中', W / 2, 16);
    ctx.font = '800 16px "M PLUS Rounded 1c", sans-serif'; ctx.fillStyle = '#ffd84a';
    if (lead) ctx.fillText(Date.now() - lead.seen > 2500 ? lead.name + ' の通信を待っています…' : lead.name + '　' + Math.floor(lead.dist / MPX) + ' m', W / 2, 42);
    ctx.restore(); return;
  }
  const m = Math.floor(dist / MPX) + ' m';
  ctx.textAlign = 'left'; ctx.strokeText(m, 16, 12); ctx.fillText(m, 16, 12);
  ctx.font = '800 20px "M PLUS Rounded 1c", sans-serif';
  const b = 'ベスト ' + Math.max(best, vs.mode ? 0 : 0) + ' m';
  ctx.textAlign = 'right'; ctx.strokeText(b, W - 14, 16); ctx.fillText(b, W - 14, 16);
  if (player.inv > 0 && state === 'play') {
    ctx.textAlign = 'center'; ctx.fillStyle = '#ffe066'; ctx.strokeText('むてき ' + player.inv.toFixed(1), W / 2, 16); ctx.fillText('むてき ' + player.inv.toFixed(1), W / 2, 16);
  }
  ctx.restore();
}
function drawObs(o, isTarget) {
  if (o.type === 'pit') {
    ctx.fillStyle = '#1a1208';
    ctx.fillRect(o.x, GROUND, o.w, H - GROUND + 10);
    ctx.fillStyle = '#000'; ctx.fillRect(o.x + 6, GROUND + 20, o.w - 12, H);
  } else if (o.type === 'door') {
    const h = 130, x = o.x, y = GROUND - h;
    // 枠
    ctx.fillStyle = '#5b3a1e'; ctx.fillRect(x - 6, y - 8, o.w + 12, 8);
    ctx.fillRect(x - 6, y, 6, h); ctx.fillRect(x + o.w, y, 6, h);
    // 扉（開くと薄くなる）
    const open = o.anim;
    const dw = o.w * (1 - open * 0.85);
    ctx.fillStyle = '#c4823e'; ctx.fillRect(x, y, dw, h);
    ctx.strokeStyle = '#8a5524'; ctx.lineWidth = 2; ctx.strokeRect(x + 3, y + 8, Math.max(1, dw - 6), 50);
    if (open < 0.5) { ctx.fillStyle = '#ffd84a'; ctx.beginPath(); ctx.arc(x + dw - 7, y + 75, 3.5, 0, 7); ctx.fill(); }
  } else if (o.type === 'river') {
    ctx.fillStyle = '#3b8fd6'; ctx.fillRect(o.x, GROUND + 6, o.w, H - GROUND);
    ctx.fillStyle = '#5fb4f0'; ctx.fillRect(o.x, GROUND + 6, o.w, 8);
    ctx.strokeStyle = '#d6f0ff'; ctx.lineWidth = 2;
    for (let wx = o.x + 8; wx < o.x + o.w - 14; wx += 26) {
      const ph = (bgOff * 0.05 + wx * 0.1);
      ctx.beginPath(); ctx.moveTo(wx, GROUND + 22 + Math.sin(ph) * 2); ctx.quadraticCurveTo(wx + 6, GROUND + 17, wx + 12, GROUND + 22 + Math.sin(ph) * 2); ctx.stroke();
    }
  } else if (o.type === 'banana') {
    ctx.save(); ctx.translate(o.x + 17, GROUND - 9); ctx.scale(1.6, 1.6);
    ctx.fillStyle = '#ffd83a'; ctx.strokeStyle = '#a07a10'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-16, -2); ctx.quadraticCurveTo(0, 10, 16, -6); ctx.quadraticCurveTo(2, 2, -16, -2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-4, 2); ctx.quadraticCurveTo(-14, -8, -18, -14); ctx.quadraticCurveTo(-8, -4, -2, 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(2, 2); ctx.quadraticCurveTo(10, -6, 14, -14); ctx.quadraticCurveTo(8, -2, 4, 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#5a3d10'; ctx.fillRect(15, -8, 3, 3);
    ctx.restore();
  } else if (o.type === 'carrot') {
    if (o.resolved) return;
    const cy = GROUND - 62 + Math.sin(bgOff * 0.03) * 5, cx = o.x + 15;
    ctx.fillStyle = '#3fae49';
    ctx.beginPath(); ctx.ellipse(cx - 5, cy - 18, 4, 10, -0.4, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 5, cy - 18, 4, 10, 0.4, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff8a1e';
    ctx.beginPath(); ctx.moveTo(cx - 11, cy - 10); ctx.lineTo(cx + 11, cy - 10); ctx.lineTo(cx, cy + 22); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#d4630c'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(cx - 6, cy - 2); ctx.lineTo(cx, cy - 2); ctx.moveTo(cx - 3, cy + 6); ctx.lineTo(cx + 4, cy + 6); ctx.stroke();
    if (state === 'play') {
      ctx.fillStyle = 'rgba(255,154,46,.95)';
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(cx - 44, cy - 66, 88, 34, 17) : ctx.rect(cx - 44, cy - 66, 88, 34); ctx.fill();
      ctx.font = '800 19px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fff'; ctx.fillText('たべる', cx, cy - 48);
      ctx.textBaseline = 'alphabetic';
    }
    return;
  } else if (o.type === 'rock') {
    if (o.resolved) return;
    const x = o.x, s = o.w;
    ctx.fillStyle = '#8a8f99';
    ctx.beginPath();
    ctx.moveTo(x, GROUND); ctx.lineTo(x + 6, GROUND - 40); ctx.lineTo(x + 22, GROUND - s); ctx.lineTo(x + 44, GROUND - 48);
    ctx.lineTo(x + s, GROUND - 16); ctx.lineTo(x + s, GROUND); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#a9aeb8'; ctx.beginPath(); ctx.moveTo(x + 12, GROUND - 38); ctx.lineTo(x + 22, GROUND - s + 6); ctx.lineTo(x + 30, GROUND - 36); ctx.fill();
    ctx.strokeStyle = '#5d626b'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + 30, GROUND - 30); ctx.lineTo(x + 38, GROUND - 16); ctx.lineTo(x + 34, GROUND - 6); ctx.stroke();
  }
  // ヒント
  if (isTarget && !o.resolved && state === 'play') {
    const cx = o.type === 'pit' ? o.x + o.w / 2 : o.x + o.w / 2;
    const cy = GROUND - (o.type === 'door' ? 170 : o.type === 'rock' ? 90 : o.type === 'banana' ? 60 : 50);
    ctx.fillStyle = o.locked ? 'rgba(255,80,80,.9)' : 'rgba(255,255,255,.92)';
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(cx - 52, cy - 20, 104, 40, 20) : ctx.rect(cx - 52, cy - 20, 104, 40); ctx.fill();
    ctx.font = '800 22px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = o.locked ? '#fff' : '#333';
    ctx.fillText(o.locked ? 'ミス！' : ICON[o.type], cx, cy + 1);
    ctx.textBaseline = 'alphabetic';
  }
}

function drawPlayer(px = PX, skinId = curSkin) {
  const SK = SKINS[skinId] || SKINS.white;
  const nonFall = deathType !== 'pit' && deathType !== 'river';
  const x = px - (state === 'dying' && nonFall ? deathT * 60 : 0);
  const baseY = GROUND - player.y + player.fallY + (player.swim ? 22 : 0);
  const run = state === 'play' && !player.jumping;
  const s = Math.sin(player.runT);
  const bob = run ? Math.abs(s) * (player.swim ? 2 : 5) : 0;          // ぴょこぴょこ跳ねる
  const air = player.jumping;
  ctx.save();
  ctx.translate(x, baseY - bob);
  if (state === 'dying' && nonFall) ctx.rotate(-deathT * 4);
  const fur = SK.fur, line = SK.line, pink = SK.ear;
  ctx.lineWidth = 1.5; ctx.strokeStyle = line;
  const blob = (cx, cy, rx, ry, rot, fill, stroke = true) => {
    ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, rot || 0, 0, 7); ctx.fill(); if (stroke) ctx.stroke();
  };

  // 耳（走ると後ろになびく）
  const earSw = run ? s * 0.12 : air ? 0.35 : 0;
  blob(8, -66, 5.5, 17, -0.35 - earSw, fur);
  blob(8, -66, 2.6, 12, -0.35 - earSw, pink, false);
  blob(18, -68, 5.5, 17, -0.1 - earSw, fur);
  blob(18, -68, 2.6, 12, -0.1 - earSw, pink, false);

  // 後ろ足・しっぽ
  const hl = run ? -s * 9 : air ? -10 : 0;
  blob(-16 + hl, -4 + (air ? -4 : 0), 13, 4.5, air ? 0.3 : 0, fur);
  blob(-30, -27, 7, 7, 0, SK.tail);

  // からだ
  blob(-4, -22, 24, 17, -0.1, fur);
  // 前足
  if (player.punchT > 0) {
    blob(26, -22, 14, 5, 0, fur);
    blob(40, -22, 6, 6, 0, fur);
  } else if (player.openT > 0) {
    blob(28, -36, 5, 9, -0.6, fur);
  } else {
    const fl = run ? s * 8 : air ? 8 : 0;
    blob(12 + fl, -4 + (air ? -6 : 0), 8, 4, air ? -0.3 : 0, fur);
  }
  // 頭
  blob(18, -40, 15, 14, 0, fur);
  ctx.fillStyle = 'rgba(255,170,190,.55)'; ctx.beginPath(); ctx.ellipse(22, -33, 4.5, 3, 0, 0, 7); ctx.fill();
  // 目
  if (state === 'dying') {
    ctx.strokeStyle = '#7a1a2a'; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(21, -46); ctx.lineTo(27, -40); ctx.moveTo(27, -46); ctx.lineTo(21, -40); ctx.stroke();
  } else {
    ctx.fillStyle = SK.eye; ctx.beginPath(); ctx.arc(24, -42, 2.8, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(25, -43, 1, 0, 7); ctx.fill();
  }
  if (SK.shine) {
    ctx.fillStyle = '#fff'; const tw = (performance.now() / 300) % (Math.PI * 2);
    [[-14, -30], [6, -50], [-2, -12]].forEach(([sx, sy], i) => { const r = 1.5 + Math.abs(Math.sin(tw + i * 2)) * 2; ctx.beginPath(); ctx.arc(sx, sy, r, 0, 7); ctx.fill(); });
  }
  // 鼻・口
  ctx.fillStyle = '#ff8fa6'; ctx.beginPath(); ctx.arc(32, -38, 2.2, 0, 7); ctx.fill();
  ctx.strokeStyle = '#b08a80'; ctx.lineWidth = 1.1;
  ctx.beginPath(); ctx.moveTo(32, -36); ctx.quadraticCurveTo(31, -33, 29, -33); ctx.stroke();
  ctx.restore();
}

loadBest();
if (playerName && isBadName(playerName)) { playerName = ''; try { localStorage.removeItem('tossaRunName'); } catch (e) {} }
if (playerName) showTitle(); else showLogin();

let last = performance.now();
let lastErr = null;
function loop(now) {
  requestAnimationFrame(loop);   // 先に次のフレームを予約（エラーが出ても止まらない）
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  try { update(dt); } catch (e) { lastErr = { m: String(e && e.message || e), t: now }; console.error(e); }
  try { draw(); } catch (e) { lastErr = { m: String(e && e.message || e), t: now }; console.error(e); try { ctx.restore(); } catch (_) {} }
  if (lastErr && now - lastErr.t < 8000) {
    ctx.save(); ctx.font = '12px sans-serif'; ctx.fillStyle = 'rgba(200,0,0,.8)'; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    ctx.fillText('エラー: ' + lastErr.m.slice(0, 60), 8, H - 6); ctx.restore();
  }
}
requestAnimationFrame(loop);
</script>
